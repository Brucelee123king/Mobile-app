name: Build Android APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build:web

      - name: Add Android platform and sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Build release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          else
            echo "::warning::No KEYSTORE_BASE64 secret found. Generating a temporary keystore - this APK cannot be updated over a build signed with a different key."
            KEYSTORE_PASSWORD=fit90temp; KEY_ALIAS=fit90; KEY_PASSWORD=fit90temp
            keytool -genkeypair -v -keystore release.keystore -alias fit90 -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass fit90temp -keypass fit90temp -dname "CN=Fit90, O=Fit90, C=IN"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Align and sign APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
            --out Fit90-release.apk aligned.apk
          "$BT/apksigner" verify --verbose Fit90-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Fit90-release-apk
          path: Fit90-release.apk
