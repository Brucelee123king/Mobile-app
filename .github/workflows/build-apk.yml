name: Build Android APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build:web

      - name: Add Android platform and sync
        run: |
          npx cap add android
          npx capacitor-assets generate --android --assetPath resources
          npx cap sync android

      - name: Build release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          else
            echo "::warning::No KEYSTORE_BASE64 secret found. Generating a temporary keystore - this APK cannot be updated over a build signed with a different key."
            KEYSTORE_PASSWORD=fit90temp; KEY_ALIAS=fit90; KEY_PASSWORD=fit90temp
            keytool -genkeypair -v -keystore release.keystore -alias fit90 -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass fit90temp -keypass fit90temp -dname "CN=Fit90, O=Fit90, C=IN"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Align and sign APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
            --out Fit90-release.apk aligned.apk
          "$BT/apksigner" verify --verbose Fit90-release.apk

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/Fit90-unsigned.apk
          cp Fit90-release.apk dist/Fit90-installable.apk
          {
            echo "commit: $GITHUB_SHA"
            echo "branch: $GITHUB_REF_NAME"
            echo "built:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Fit90-unsigned.apk    = unsigned release build (cannot be installed until signed)"
            echo "Fit90-installable.apk = same build signed (install this on a phone)"
          } > dist/BUILD.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Fit90-apks
          path: dist/

      - name: Publish APKs to apk-builds branch
        run: |
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b apk-builds
          git add -A
          git commit -q -m "APK build for ${GITHUB_SHA::7} [skip ci]"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-builds
