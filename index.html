<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" id="tc">
<meta name="color-scheme" content="light dark">
<meta name="description" content="3-month weight loss planner with daily meals, water tracking and guided workouts.">
<title>Fit 90</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#app">Skip to content</a>
<nav id="nav" aria-label="Main">
  <div class="brand" aria-hidden="true">Fit 90</div>
  <button data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Today</span></button>
  <button data-tab="meals"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8a2 2 0 0 0 2 2v8"/><path d="M5 3v6M9 3v6"/><path d="M17 3c-2 2-3 5-3 8h3v10"/></svg><span>Meals</span></button>
  <button data-tab="water"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg><span>Water</span></button>
  <button data-tab="exercise"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg><span>Workout</span></button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg><span>Progress</span></button>
</nav>
<main id="app" tabindex="-1"></main>
<div id="sheet" role="dialog" aria-modal="true" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script src="guides.js"></script>
<script src="app.js"></script>
<noscript>Fit 90 needs JavaScript to run.</noscript>
</body>
</html>
